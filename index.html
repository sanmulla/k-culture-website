<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Culture World 🌸</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Poppins', 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #ffd9ec, #f0bafc);
      color: #4b2c5e;
      text-align: center;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      margin-top: 70px;
      animation: fadeIn 1s ease-in-out;
    }

    header h1 {
      font-size: 36px;
      color: #b26edb;
      text-shadow: 0 2px 8px rgba(178, 110, 219, 0.3);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      color: #6e4379;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 25px;
      margin: 60px 0;
      width: 85%;
      max-width: 500px;
      animation: fadeUp 1.2s ease;
      z-index: 2;
    }

    .btn {
      background: linear-gradient(90deg, #e6a9f0, #c07cf0);
      color: white;
      text-decoration: none;
      padding: 18px 22px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 18px;
      box-shadow: 0 6px 15px rgba(178, 110, 219, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      transform: scale(1.07);
      box-shadow: 0 10px 25px rgba(178, 110, 219, 0.4);
    }

    /* 🌸 Image styling */
    .btn img {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      padding: 4px;
      box-shadow: 0 4px 10px rgba(178, 110, 219, 0.3);
      animation: float 3s ease-in-out infinite;
      transition: transform 0.3s ease;
    }

    .btn:hover img {
      transform: scale(1.1) rotate(5deg);
    }

    footer {
      width: 100%;
      text-align: center;
      margin-bottom: 25px;
      color: #6e4379;
      font-size: 15px;
      opacity: 0.9;
      position: relative;
      z-index: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ✨ Gentle floating animation for images */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>
<body>
  <header>
    <h1>🌸 Welcome to K-Culture World 🌸</h1>
    <p class="subtitle">Experience the beauty of Korean food, language & traditions</p>
  </header>

  <main class="buttons">
    <a href="food.html" class="btn">
      <img src="assets/images/food.png.jpg" alt="Food Icon"> 🍱 Taste of Korea
    </a>

    <a href="language.html" class="btn">
      <img src="assets/images/hangul.png.jpg" alt="Hangul Icon"> 🈴 Hangul Harmony
    </a>

    <a href="culture.html" class="btn">
      <img src="assets/images/culture.png.jpg" alt="Culture Icon"> 🏯 Discover Culture
    </a>
  </main>

  <footer>
    <p>Created with ❤️ by <strong>Sana</strong></p>
  </footer>
</body>
</html>
